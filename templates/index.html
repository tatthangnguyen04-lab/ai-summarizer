<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Briefly AI - Text & PDF Summarizer</title>
  <!-- Tailwind CSS & React via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef } = React;

    const SAMPLES = [
      {
        label: "Technology",
        text: "Quantum computing represents a fundamental shift in computation. Unlike classical computers that store bits as strictly 0 or 1, quantum computers leverage qubits in superposition. This allows quantum algorithms to solve vast combinatorial problems exponentially faster, revolutionizing fields like drug discovery, cryptography, and molecular simulation. However, maintaining qubit coherence near absolute zero remains an active engineering hurdle."
      },
      {
        label: "Business",
        text: "In Q3 2026, enterprise revenue rose 18.4% year-over-year to $412 million, driven by accelerated cloud infrastructure adoption. Operating margins expanded by 210 basis points, and free cash flow reached $104 million with zero debt maturities prior to 2029. Management raised full-year guidance from $1.58B to $1.64B."
      }
    ];

    function App() {
      const [text, setText] = useState('');
      const [summary, setSummary] = useState('');
      const [format, setFormat] = useState('bullets');
      const [length, setLength] = useState('medium');
      const [tone, setTone] = useState('professional');
      const [loading, setLoading] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [fileMeta, setFileMeta] = useState(null);
      const [error, setError] = useState(null);
      const [copied, setCopied] = useState(false);
      const [isDragging, setIsDragging] = useState(false);
      const fileInputRef = useRef(null);

      const wordCount = useMemo(() => text.trim() ? text.trim().split(/\s+/).length : 0, [text]);
      const summaryWords = useMemo(() => summary.trim() ? summary.trim().split(/\s+/).length : 0, [summary]);

      const handleFileUpload = async (file) => {
        if (!file) return;
        setUploading(true);
        setError(null);

        const formData = new FormData();
        formData.append('file', file);

        try {
          const res = await fetch('/upload-document', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to upload and extract document text.');
          
          setText(data.text);
          setFileMeta({
            name: data.filename,
            pages: data.pageCount,
            words: data.wordCount
          });
        } catch (err) {
          setError(err.message);
        } finally {
          setUploading(false);
        }
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = (e) => {
        e.preventDefault();
        setIsDragging(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFileUpload(e.dataTransfer.files[0]);
        }
      };

      const clearFile = () => {
        setFileMeta(null);
        setText('');
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const handleSummarize = async () => {
        if (!text.trim()) return;
        setLoading(true);
        setError(null);
        try {
          const res = await fetch('/summarize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, format, length, tone })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Summarization failed');
          setSummary(data.summary);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const copyToClipboard = () => {
        navigator.clipboard.writeText(summary);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="border-b border-neutral-800 bg-neutral-900/90 px-6 py-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white">
                <i className="fa-solid fa-wand-magic-sparkles text-sm"></i>
              </div>
              <h1 className="text-lg font-bold tracking-tight text-white">Briefly AI</h1>
            </div>
            <div className="flex items-center gap-2 text-xs bg-neutral-900 border border-neutral-800 px-3 py-1.5 rounded-full text-emerald-400">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              PDF Extraction & LLM Active
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-6xl w-full mx-auto p-6 flex-1 flex flex-col gap-6">
            {/* Format & Controls Bar */}
            <div className="bg-neutral-900 border border-neutral-800 rounded-xl p-4 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="text-xs font-semibold text-neutral-400 uppercase">Format:</span>
                {['bullets', 'tldr', 'executive'].map((f) => (
                  <button
                    key={f}
                    onClick={() => setFormat(f)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium capitalize transition-all ${
                      format === f ? 'bg-indigo-600 text-white' : 'bg-neutral-800 text-neutral-300 hover:bg-neutral-700'
                    }`}
                  >
                    {f === 'bullets' ? 'Bullet Points' : f.toUpperCase()}
                  </button>
                ))}
              </div>

              <div className="flex items-center gap-4">
                <div className="flex items-center gap-2 text-xs">
                  <span className="text-neutral-400">Length:</span>
                  <select
                    value={length}
                    onChange={(e) => setLength(e.target.value)}
                    className="bg-neutral-800 border border-neutral-700 text-neutral-200 rounded px-2 py-1"
                  >
                    <option value="short">Short</option>
                    <option value="medium">Medium</option>
                    <option value="detailed">Detailed</option>
                  </select>
                </div>
                <div className="flex items-center gap-2 text-xs">
                  <span className="text-neutral-400">Tone:</span>
                  <select
                    value={tone}
                    onChange={(e) => setTone(e.target.value)}
                    className="bg-neutral-800 border border-neutral-700 text-neutral-200 rounded px-2 py-1"
                  >
                    <option value="professional">Professional</option>
                    <option value="casual">Casual</option>
                    <option value="academic">Academic</option>
                  </select>
                </div>
              </div>
            </div>

            {/* Input & Output Columns */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1">
              {/* Input Box */}
              <div className="bg-neutral-900 border border-neutral-800 rounded-xl p-5 flex flex-col gap-3">
                <div className="flex items-center justify-between text-xs text-neutral-400">
                  <span className="font-semibold text-neutral-300">Input Source</span>
                  <div className="flex gap-2">
                    {SAMPLES.map((s, idx) => (
                      <button
                        key={idx}
                        onClick={() => { clearFile(); setText(s.text); }}
                        className="bg-neutral-800 hover:bg-neutral-700 px-2 py-0.5 rounded text-[11px] text-neutral-300"
                      >
                        Sample {s.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* PDF Drag and Drop Area */}
                <input
                  type="file"
                  ref={fileInputRef}
                  onChange={(e) => e.target.files && handleFileUpload(e.target.files[0])}
                  accept=".pdf,.txt,.md"
                  className="hidden"
                />

                {fileMeta ? (
                  <div className="bg-neutral-950 border border-indigo-500/40 rounded-lg p-3 flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <div className="w-8 h-8 rounded bg-indigo-500/20 text-indigo-400 flex items-center justify-center">
                        <i className="fa-regular fa-file-pdf text-sm"></i>
                      </div>
                      <div>
                        <div className="text-xs font-semibold text-neutral-200 truncate max-w-[200px]">{fileMeta.name}</div>
                        <div className="text-[11px] text-neutral-400">{fileMeta.pages} page(s) • {fileMeta.words} words parsed</div>
                      </div>
                    </div>
                    <button
                      onClick={clearFile}
                      className="text-neutral-400 hover:text-red-400 text-xs p-1"
                      title="Remove file"
                    >
                      <i className="fa-solid fa-xmark"></i>
                    </button>
                  </div>
                ) : (
                  <div
                    onDragOver={handleDragOver}
                    onDragLeave={handleDragLeave}
                    onDrop={handleDrop}
                    onClick={() => fileInputRef.current && fileInputRef.current.click()}
                    className={`border-2 border-dashed rounded-lg p-4 text-center cursor-pointer transition-all ${
                      isDragging
                        ? 'border-indigo-500 bg-indigo-950/20'
                        : 'border-neutral-800 hover:border-neutral-700 bg-neutral-950/50'
                    }`}
                  >
                    {uploading ? (
                      <div className="flex items-center justify-center gap-2 text-xs text-indigo-400 py-1">
                        <i className="fa-solid fa-circle-notch animate-spin"></i>
                        Extracting text from document...
                      </div>
                    ) : (
                      <div className="text-xs text-neutral-400 flex items-center justify-center gap-2 py-1">
                        <i className="fa-solid fa-cloud-arrow-up text-neutral-400"></i>
                        <span>Drop <strong>PDF</strong> or <strong>TXT</strong> here, or <span className="text-indigo-400 underline">browse</span></span>
                      </div>
                    )}
                  </div>
                )}

                {/* Text Area */}
                <textarea
                  value={text}
                  onChange={(e) => setText(e.target.value)}
                  placeholder="Or paste your raw text here..."
                  className="w-full flex-1 min-h-[220px] bg-neutral-950 border border-neutral-800 rounded-lg p-4 text-sm text-neutral-200 placeholder-neutral-500 focus:outline-none focus:border-indigo-500 resize-none font-mono"
                />

                <div className="flex items-center justify-between pt-2">
                  <span className="text-xs text-neutral-400">{wordCount} words</span>
                  <button
                    onClick={handleSummarize}
                    disabled={loading || uploading || !text.trim()}
                    className="bg-indigo-600 hover:bg-indigo-500 disabled:bg-neutral-800 disabled:text-neutral-500 text-white text-sm font-medium px-5 py-2 rounded-lg transition-all flex items-center gap-2"
                  >
                    {loading ? (
                      <>
                        <i className="fa-solid fa-circle-notch animate-spin"></i>
                        Summarizing...
                      </>
                    ) : (
                      <>
                        <i className="fa-solid fa-bolt"></i>
                        Summarize
                      </>
                    )}
                  </button>
                </div>
                {error && <div className="text-xs text-red-400 bg-red-950/40 p-2.5 rounded border border-red-800/50">{error}</div>}
              </div>

              {/* Output Box */}
              <div className="bg-neutral-900 border border-neutral-800 rounded-xl p-5 flex flex-col gap-3">
                <div className="flex items-center justify-between text-xs text-neutral-400">
                  <span className="font-semibold text-neutral-300">AI Summary</span>
                  {summary && (
                    <button
                      onClick={copyToClipboard}
                      className="bg-neutral-800 hover:bg-neutral-700 px-2.5 py-1 rounded text-neutral-200 flex items-center gap-1.5 transition-colors"
                    >
                      <i className={`fa-solid ${copied ? 'fa-check text-emerald-400' : 'fa-copy'}`}></i>
                      {copied ? 'Copied' : 'Copy'}
                    </button>
                  )}
                </div>

                <div className="flex-1 min-h-[300px] bg-neutral-950 border border-neutral-800 rounded-lg p-4 text-sm text-neutral-200 whitespace-pre-wrap overflow-y-auto">
                  {summary ? (
                    summary
                  ) : (
                    <div className="h-full flex flex-col items-center justify-center text-neutral-500 text-xs py-16">
                      <i className="fa-regular fa-file-lines text-3xl mb-2 text-neutral-600"></i>
                      Summary will appear here
                    </div>
                  )}
                </div>

                {summary && (
                  <div className="text-xs text-neutral-400 flex justify-between border-t border-neutral-800 pt-3">
                    <span>Summary: <strong className="text-neutral-200">{summaryWords}</strong> words</span>
                    <span className="text-emerald-400 font-semibold">
                      {wordCount ? `-${Math.max(0, Math.round(((wordCount - summaryWords) / wordCount) * 100))}% reduction` : ''}
                    </span>
                  </div>
                )}
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
