<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Briefly AI - Text, PDF & Web Article Summarizer</title>
  <!-- Sleek Indigo Sparkle Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><path d='M50 20 L56 38 L74 44 L56 50 L50 68 L44 50 L26 44 L44 38 Z' fill='%23ffffff'/><circle cx='70' cy='25' r='4' fill='%23a5b4fc'/><circle cx='30' cy='65' r='3' fill='%23a5b4fc'/></svg>">
  
  <!-- Tailwind CSS & React via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .typing-cursor {
      display: inline-block;
      width: 6px;
      height: 14px;
      background-color: #6366f1;
      margin-left: 3px;
      vertical-align: middle;
      animation: blink 0.8s infinite;
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef } = React;

    const SAMPLES = [
      {
        label: "Tech Sample",
        text: "Quantum computing represents a fundamental shift in computation. Unlike classical computers that store bits as strictly 0 or 1, quantum computers leverage qubits in superposition. This allows quantum algorithms to solve vast combinatorial problems exponentially faster, revolutionizing fields like drug discovery, cryptography, and molecular simulation. However, maintaining qubit coherence near absolute zero remains an active engineering hurdle."
      },
      {
        label: "Business Sample",
        text: "In Q3 2026, enterprise revenue rose 18.4% year-over-year to $412 million, driven by accelerated cloud infrastructure adoption. Operating margins expanded by 210 basis points, and free cash flow reached $104 million with zero debt maturities prior to 2029. Management raised full-year guidance from $1.58B to $1.64B."
      }
    ];

    function App() {
      const [inputMode, setInputMode] = useState('text'); // 'text' | 'file' | 'url'
      const [text, setText] = useState('');
      const [urlInput, setUrlInput] = useState('');
      const [summary, setSummary] = useState('');
      const [format, setFormat] = useState('bullets');
      const [length, setLength] = useState('medium');
      const [tone, setTone] = useState('professional');
      const [isStreaming, setIsStreaming] = useState(false);
      const [scraping, setScraping] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [sourceMeta, setSourceMeta] = useState(null);
      const [error, setError] = useState(null);
      const [copied, setCopied] = useState(false);
      const [isDragging, setIsDragging] = useState(false);
      
      const fileInputRef = useRef(null);
      const queueRef = useRef('');
      const isDrainingRef = useRef(false);
      const isStreamDoneRef = useRef(false);

      const wordCount = useMemo(() => text.trim() ? text.trim().split(/\s+/).length : 0, [text]);
      const summaryWords = useMemo(() => summary.trim() ? summary.trim().split(/\s+/).length : 0, [summary]);

      const startDrainingQueue = () => {
        if (isDrainingRef.current) return;
        isDrainingRef.current = true;

        const interval = setInterval(() => {
          if (queueRef.current.length > 0) {
            const chunkSize = queueRef.current.length > 100 ? 5 : (queueRef.current.length > 40 ? 3 : 1);
            const charsToAppend = queueRef.current.slice(0, chunkSize);
            queueRef.current = queueRef.current.slice(chunkSize);
            setSummary(prev => prev + charsToAppend);
          } else if (isStreamDoneRef.current) {
            clearInterval(interval);
            isDrainingRef.current = false;
            setIsStreaming(false);
          }
        }, 14);
      };

      const handleFileUpload = async (file) => {
        if (!file) return;
        setUploading(true);
        setError(null);

        const formData = new FormData();
        formData.append('file', file);

        try {
          const res = await fetch('/upload-document', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to upload and extract document text.');
          
          setText(data.text);
          setSourceMeta({
            type: 'file',
            title: data.filename,
            detail: `${data.pageCount} page(s) • ${data.wordCount} words`
          });
        } catch (err) {
          setError(err.message);
        } finally {
          setUploading(false);
        }
      };

      const handleScrapeUrl = async (targetUrl = urlInput) => {
        if (!targetUrl.trim()) return;
        setScraping(true);
        setError(null);

        try {
          const res = await fetch('/scrape-url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: targetUrl })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to scrape webpage.');

          setText(data.text);
          setSourceMeta({
            type: 'url',
            title: data.title,
            detail: `${data.url} • ${data.wordCount} words`
          });
        } catch (err) {
          setError(err.message);
        } finally {
          setScraping(false);
        }
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = (e) => {
        e.preventDefault();
        setIsDragging(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          setInputMode('file');
          handleFileUpload(e.dataTransfer.files[0]);
        }
      };

      const clearSource = () => {
        setSourceMeta(null);
        setText('');
        setUrlInput('');
        if (fileInputRef.current) fileInputRef.current.value = '';
      };

      const handleSummarizeStream = async () => {
        if (!text.trim() || isStreaming) return;
        setIsStreaming(true);
        setSummary('');
        setError(null);
        queueRef.current = '';
        isStreamDoneRef.current = false;

        startDrainingQueue();

        try {
          const res = await fetch('/summarize', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, format, length, tone })
          });

          if (!res.ok) {
            const data = await res.json();
            throw new Error(data.error || 'Summarization request failed');
          }

          const reader = res.body.getReader();
          const decoder = new TextDecoder('utf-8');
          let buffer = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();

            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith('data: ')) {
                const payload = trimmed.replace('data: ', '').trim();
                if (payload === '[DONE]') {
                  isStreamDoneRef.current = true;
                  break;
                }
                try {
                  const parsed = JSON.parse(payload);
                  if (parsed.token) {
                    queueRef.current += parsed.token;
                  }
                  if (parsed.error) {
                    throw new Error(parsed.error);
                  }
                } catch (jsonErr) {
                  // Ignore SSE lines
                }
              }
            }
          }
          isStreamDoneRef.current = true;
        } catch (err) {
          setError(err.message);
          setIsStreaming(false);
          isStreamDoneRef.current = true;
        }
      };

      const copyToClipboard = () => {
        navigator.clipboard.writeText(summary);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="border-b border-neutral-800 bg-neutral-900/90 px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-2.5">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shrink-0">
                <i className="fa-solid fa-wand-magic-sparkles text-sm"></i>
              </div>
              <h1 className="text-lg font-bold tracking-tight text-white">Briefly AI</h1>
            </div>
            <div className="flex items-center gap-2 text-xs bg-neutral-900 border border-neutral-800 px-3 py-1.5 rounded-full text-emerald-400">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
              <span className="truncate">Active • Mobile Layout Fixed</span>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-6xl w-full mx-auto p-4 sm:p-6 flex-1 flex flex-col gap-4 sm:gap-6">
            {/* Format & Controls Bar */}
            <div className="bg-neutral-900 border border-neutral-800 rounded-xl p-3.5 sm:p-4 flex flex-col md:flex-row md:items-center md:justify-between gap-3 sm:gap-4">
              <div className="flex flex-wrap items-center gap-2">
                <span className="text-xs font-semibold text-neutral-400 uppercase tracking-wider">Format:</span>
                <div className="flex flex-wrap gap-1.5">
                  {['bullets', 'tldr', 'executive'].map((f) => (
                    <button
                      key={f}
                      onClick={() => setFormat(f)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-medium capitalize transition-all ${
                        format === f ? 'bg-indigo-600 text-white shadow-sm' : 'bg-neutral-800 text-neutral-300 hover:bg-neutral-700'
                      }`}
                    >
                      {f === 'bullets' ? 'Bullets' : f.toUpperCase()}
                    </button>
                  ))}
                </div>
              </div>

              <div className="flex items-center gap-3 sm:gap-4 self-start md:self-auto">
                <div className="flex items-center gap-1.5 text-xs">
                  <span className="text-neutral-400">Length:</span>
                  <select
                    value={length}
                    onChange={(e) => setLength(e.target.value)}
                    className="bg-neutral-800 border border-neutral-700 text-neutral-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500"
                  >
                    <option value="short">Short</option>
                    <option value="medium">Medium</option>
                    <option value="detailed">Detailed</option>
                  </select>
                </div>
                <div className="flex items-center gap-1.5 text-xs">
                  <span className="text-neutral-400">Tone:</span>
                  <select
                    value={tone}
                    onChange={(e) => setTone(e.target.value)}
                    className="bg-neutral-800 border border-neutral-700 text-neutral-200 rounded px-2 py-1 text-xs focus:outline-none focus:border-indigo-500"
                  >
                    <option value="professional">Professional</option>
                    <option value="casual">Casual</option>
                    <option value="academic">Academic</option>
                  </select>
                </div>
              </div>
            </div>

            {/* Input & Output Columns */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 flex-1">
              {/* Input Box */}
              <div className="bg-neutral-900 border border-neutral-800 rounded-xl p-4 sm:p-5 flex flex-col gap-3">
                {/* Source Mode Tabs & Sample Shortcuts */}
                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2.5 border-b border-neutral-800 pb-3">
                  <div className="flex bg-neutral-950 p-1 rounded-lg border border-neutral-800 w-full sm:w-auto">
                    <button
                      onClick={() => setInputMode('text')}
                      className={`flex-1 sm:flex-initial px-3 py-1 text-xs rounded-md font-medium transition-colors flex items-center justify-center gap-1.5 ${
                        inputMode === 'text' ? 'bg-neutral-800 text-white shadow-sm' : 'text-neutral-400 hover:text-neutral-200'
                      }`}
                    >
                      <i className="fa-solid fa-align-left text-[11px]"></i> Text
                    </button>
                    <button
                      onClick={() => setInputMode('file')}
                      className={`flex-1 sm:flex-initial px-3 py-1 text-xs rounded-md font-medium transition-colors flex items-center justify-center gap-1.5 ${
                        inputMode === 'file' ? 'bg-neutral-800 text-white shadow-sm' : 'text-neutral-400 hover:text-neutral-200'
                      }`}
                    >
                      <i className="fa-regular fa-file-pdf text-[11px]"></i> Doc
                    </button>
                    <button
                      onClick={() => setInputMode('url')}
                      className={`flex-1 sm:flex-initial px-3 py-1 text-xs rounded-md font-medium transition-colors flex items-center justify-center gap-1.5 ${
                        inputMode === 'url' ? 'bg-neutral-800 text-white shadow-sm' : 'text-neutral-400 hover:text-neutral-200'
                      }`}
                    >
                      <i className="fa-solid fa-globe text-[11px]"></i> URL
                    </button>
                  </div>

                  {inputMode === 'text' && (
                    <div className="flex items-center gap-1.5 overflow-x-auto pb-1 sm:pb-0">
                      <span className="text-[11px] text-neutral-500 hidden sm:inline">Try:</span>
                      {SAMPLES.map((s, idx) => (
                        <button
                          key={idx}
                          onClick={() => { clearSource(); setText(s.text); }}
                          className="bg-neutral-800 hover:bg-neutral-700 px-2.5 py-1 rounded text-[11px] text-neutral-300 whitespace-nowrap transition-colors"
                        >
                          {s.label}
                        </button>
                      ))}
                    </div>
                  )}
                </div>

                {/* URL Input Form */}
                {inputMode === 'url' && (
                  <div className="flex gap-2">
                    <input
                      type="url"
                      value={urlInput}
                      onChange={(e) => setUrlInput(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && handleScrapeUrl()}
                      placeholder="Paste article URL (e.g. https://en.wikipedia.org/...)"
                      className="flex-1 bg-neutral-950 border border-neutral-800 rounded-lg px-3 py-2 text-xs text-neutral-200 placeholder-neutral-500 focus:outline-none focus:border-indigo-500"
                    />
                    <button
                      onClick={() => handleScrapeUrl()}
                      disabled={scraping || !urlInput.trim()}
                      className="bg-indigo-600 hover:bg-indigo-500 disabled:bg-neutral-800 disabled:text-neutral-500 text-white text-xs font-medium px-3.5 py-2 rounded-lg transition-all flex items-center gap-1.5 shrink-0"
                    >
                      {scraping ? (
                        <>
                          <i className="fa-solid fa-circle-notch animate-spin"></i>
                          Fetching...
                        </>
                      ) : (
                        <>
                          <i className="fa-solid fa-download"></i>
                          Extract
                        </>
                      )}
                    </button>
                  </div>
                )}

                {/* PDF Drag & Drop Area */}
                {inputMode === 'file' && (
                  <>
                    <input
                      type="file"
                      ref={fileInputRef}
                      onChange={(e) => e.target.files && handleFileUpload(e.target.files[0])}
                      accept=".pdf,.txt,.md"
                      className="hidden"
                    />
                    <div
                      onDragOver={handleDragOver}
                      onDragLeave={handleDragLeave}
                      onDrop={handleDrop}
                      onClick={() => fileInputRef.current && fileInputRef.current.click()}
                      className={`border-2 border-dashed rounded-lg p-4 text-center cursor-pointer transition-all ${
                        isDragging
                          ? 'border-indigo-500 bg-indigo-950/20'
                          : 'border-neutral-800 hover:border-neutral-700 bg-neutral-950/50'
                      }`}
                    >
                      {uploading ? (
                        <div className="flex items-center justify-center gap-2 text-xs text-indigo-400 py-1">
                          <i className="fa-solid fa-circle-notch animate-spin"></i>
                          Extracting text from document...
                        </div>
                      ) : (
                        <div className="text-xs text-neutral-400 flex items-center justify-center gap-2 py-1">
                          <i className="fa-solid fa-cloud-arrow-up text-neutral-400"></i>
                          <span>Drop <strong>PDF</strong> / <strong>TXT</strong> or <span className="text-indigo-400 underline">browse</span></span>
                        </div>
                      )}
                    </div>
                  </>
                )}

                {/* Source Badge if parsed */}
                {sourceMeta && (
                  <div className="bg-neutral-950 border border-indigo-500/40 rounded-lg p-2.5 flex items-center justify-between">
                    <div className="flex items-center gap-2.5 min-w-0">
                      <div className="w-7 h-7 rounded bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xs shrink-0">
                        <i className={sourceMeta.type === 'url' ? 'fa-solid fa-globe' : 'fa-regular fa-file-pdf'}></i>
                      </div>
                      <div className="truncate">
                        <div className="text-xs font-semibold text-neutral-200 truncate">{sourceMeta.title}</div>
                        <div className="text-[10px] text-neutral-400 truncate">{sourceMeta.detail}</div>
                      </div>
                    </div>
                    <button
                      onClick={clearSource}
                      className="text-neutral-400 hover:text-red-400 text-xs p-1 ml-2 shrink-0"
                      title="Clear source"
                    >
                      <i className="fa-solid fa-xmark"></i>
                    </button>
                  </div>
                )}

                {/* Text Area */}
                <textarea
                  value={text}
                  onChange={(e) => setText(e.target.value)}
                  placeholder="Paste text, upload a document, or extract a URL above..."
                  className="w-full flex-1 min-h-[180px] sm:min-h-[220px] bg-neutral-950 border border-neutral-800 rounded-lg p-3.5 sm:p-4 text-sm text-neutral-200 placeholder-neutral-500 focus:outline-none focus:border-indigo-500 resize-none font-mono"
                />

                <div className="flex items-center justify-between pt-2">
                  <span className="text-xs text-neutral-400">{wordCount} words</span>
                  <button
                    onClick={handleSummarizeStream}
                    disabled={isStreaming || scraping || uploading || !text.trim()}
                    className="bg-indigo-600 hover:bg-indigo-500 disabled:bg-neutral-800 disabled:text-neutral-500 text-white text-sm font-medium px-4 sm:px-5 py-2 rounded-lg transition-all flex items-center gap-2"
                  >
                    {isStreaming ? (
                      <>
                        <i className="fa-solid fa-circle-notch animate-spin"></i>
                        Streaming...
                      </>
                    ) : (
                      <>
                        <i className="fa-solid fa-bolt"></i>
                        Summarize
                      </>
                    )}
                  </button>
                </div>
                {error && <div className="text-xs text-red-400 bg-red-950/40 p-2.5 rounded border border-red-800/50">{error}</div>}
              </div>

              {/* Output Box */}
              <div className="bg-neutral-900 border border-neutral-800 rounded-xl p-4 sm:p-5 flex flex-col gap-3">
                <div className="flex items-center justify-between text-xs text-neutral-400">
                  <span className="font-semibold text-neutral-300">AI Summary</span>
                  {summary && (
                    <button
                      onClick={copyToClipboard}
                      className="bg-neutral-800 hover:bg-neutral-700 px-2.5 py-1 rounded text-neutral-200 flex items-center gap-1.5 transition-colors"
                    >
                      <i className={`fa-solid ${copied ? 'fa-check text-emerald-400' : 'fa-copy'}`}></i>
                      {copied ? 'Copied' : 'Copy'}
                    </button>
                  )}
                </div>

                <div className="flex-1 min-h-[220px] sm:min-h-[300px] bg-neutral-950 border border-neutral-800 rounded-lg p-3.5 sm:p-4 text-sm text-neutral-200 whitespace-pre-wrap overflow-y-auto font-sans leading-relaxed">
                  {summary ? (
                    <>
                      {summary}
                      {isStreaming && <span className="typing-cursor"></span>}
                    </>
                  ) : (
                    <div className="h-full flex flex-col items-center justify-center text-neutral-500 text-xs py-12 sm:py-16">
                      <i className="fa-regular fa-file-lines text-3xl mb-2 text-neutral-600"></i>
                      Summary will stream live here
                    </div>
                  )}
                </div>

                {summary && (
                  <div className="text-xs text-neutral-400 flex justify-between border-t border-neutral-800 pt-3">
                    <span>Summary: <strong className="text-neutral-200">{summaryWords}</strong> words</span>
                    <span className="text-emerald-400 font-semibold">
                      {wordCount ? `-${Math.max(0, Math.round(((wordCount - summaryWords) / wordCount) * 100))}% reduction` : ''}
                    </span>
                  </div>
                )}
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
